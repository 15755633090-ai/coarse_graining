name: motil-win
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy=1.23.*
  - pandas=1.5.*
  - scipy=1.9.*
  - scikit-learn=1.1.*
  - matplotlib=3.6.*
  - seaborn=0.12.*
  - networkx=2.8.*
  - rdkit=2022.09.*
  - pytorch=1.12.*
  - torchvision=0.13.*
  - torchaudio=0.12.*
  - cpuonly
  - pyg=2.3.*
  - pip:
      - tensorboardX==1.8
      - tqdm
      - joblib
      - pyyaml
      - protobuf==3.20.3
      - ogb==1.3.5
      - fitlog==0.9.13
